[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  port = 8888
  publish = "public"

# Clean /api/* URLs for the serverless functions
[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat-intent"
  status = 200

[[redirects]]
  from = "/api/cart"
  to = "/.netlify/functions/cart"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/products/seed"
  to = "/.netlify/functions/products-seed"
  status = 200
